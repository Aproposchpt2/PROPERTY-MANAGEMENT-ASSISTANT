[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,OWNER_NOTIFICATION_EMAIL,RESEND_FROM_EMAIL,RESEND_TO_EMAIL"

[build.processing]
  [build.processing.css]
  [build.processing.html]
  [build.processing.images]
  [build.processing.js]

[functions]
  [functions."*"]
    node_bundler = "esbuild"

  [functions."cedar-elevenlabs"]
    timeout = 15

  [functions."ops-admin-api"]
    timeout = 26

  [functions."ops-trace-api"]
    timeout = 26

# The site publishes the repo root, so internal folders and files are blocked here.
# These rules come first: the first matching redirect wins.
# Retired FlowDesk Pro page (removed 2026-11-07)
[[redirects]]
  from = "/past-performance.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/command-center/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/test/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/claude.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api/intake"
  to = "/.netlify/functions/pma-intake"
  status = 200
  force = true

[[redirects]]
  from = "/api/intake/carol-sip-openai"
  to = "/.netlify/functions/carol-sip-openai"
  status = 200
  force = true

[[redirects]]
  from = "/api/intake/cedar-twilio"
  to = "/.netlify/functions/cedar-twilio"
  status = 200
  force = true

[[redirects]]
  from = "/api/tools/cedar-elevenlabs"
  to = "/.netlify/functions/cedar-elevenlabs"
  status = 200
  force = true

[[redirects]]
  from = "/api/postcall"
  to = "/.netlify/functions/cedar-postcall"
  status = 200
  force = true

[[redirects]]
  from = "/api/call-log"
  to = "/.netlify/functions/cedar-call-log"
  status = 200
  force = true

[[redirects]]
  from = "/api/manager/*"
  to = "/.netlify/functions/pma-manager-api"
  status = 200
  force = true

[[redirects]]
  from = "/api/portal/*"
  to = "/.netlify/functions/pma-portal-api"
  status = 200
  force = true

[[redirects]]
  from = "/api/tools/pma-vendor"
  to = "/.netlify/functions/pma-vendor"
  status = 200
  force = true

[[redirects]]
  from = "/api/sms/vendor-inbound"
  to = "/.netlify/functions/pma-vendor-inbound"
  status = 200
  force = true

[[redirects]]
  from = "/api/approve"
  to = "/.netlify/functions/pma-approve-api"
  status = 200
  force = true

# SEO: keep internal, portal and legacy (FlowDesk-branded) pages out of search results.
# The public marketing page (/) is indexable; see robots.txt and sitemap.xml.
[[headers]]
  for = "/dashboard.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/demo-request.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/privacy.html"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/terms.html"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/command-center/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/api/ops/trace/*"
  to = "/.netlify/functions/ops-trace-api"
  status = 200
  force = true

[[redirects]]
  from = "/admin/testing/calls"
  to = "/admin/calls.html"
  status = 200
  force = true

[[redirects]]
  from = "/api/ops/*"
  to = "/.netlify/functions/ops-admin-api"
  status = 200
  force = true

[[redirects]]
  from = "/admin/testing/script/*"
  to = "/admin/testing-history.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/testing"
  to = "/admin/testing.html"
  status = 200

# Simulation Testing admin panel: never indexed.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
