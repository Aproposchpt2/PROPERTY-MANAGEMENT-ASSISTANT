[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,OWNER_NOTIFICATION_EMAIL,RESEND_FROM_EMAIL,RESEND_TO_EMAIL"

[build.processing]
  [build.processing.css]
  [build.processing.html]
  [build.processing.images]
  [build.processing.js]

[functions]
  [functions."*"]
    node_bundler = "esbuild"

[[redirects]]
  from = "/api/intake/carol-sip-openai"
  to = "/.netlify/functions/carol-sip-openai"
  status = 200
  force = true
